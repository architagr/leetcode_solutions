name: Discord daily post

# Posts one queued challenge entry per day to Discord, oldest first.
#
# GitHub's scheduled runs are best-effort and are queued hardest on round
# times, so a single cron at :30 has drifted by hours (2026-09-04 fired at
# 08:09 UTC for an 03:30 slot). Two defences: the crons sit on an odd
# minute away from the top of the hour, and there are several of them
# acting as retries. Posting is guarded server-side by the same-day check
# in PostDiscord, so whichever cron lands first posts and the rest are
# no-ops — extra crons can only make the post earlier, never double it.
on:
  schedule:
    # 00:22 UTC = 05:52 IST — earliest attempt.
    - cron: "22 0 * * *"
    # 03:22 UTC = 08:52 IST — the intended slot.
    - cron: "22 3 * * *"
    # Retries, in case GitHub delays or drops the one above.
    - cron: "22 4 * * *"
    - cron: "22 5 * * *"
    - cron: "22 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post even if a day already went out today (manual catch-up)"
        type: boolean
        default: false

# Needed to push the queue.yaml update back to the repo.
permissions:
  contents: write

concurrency:
  # Never let two runs post at once — that would send the same day twice.
  group: discord-daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Post the next queued day to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          # tee returns its own exit code, so without pipefail a post that
          # Discord rejected would report success and the run would go green
          # on a day that never went out.
          set -o pipefail
          go run ./challenge/cmd/leetcodectl post-discord \
            "{\"repoRoot\":\".\",\"queuePath\":\"challenge/queue.yaml\",\"force\":${FORCE}}" | tee result.json

      - name: Commit the queue update
        run: |
          if git diff --quiet challenge/queue.yaml; then
            echo "Queue unchanged (nothing was posted) — nothing to commit."
            exit 0
          fi
          day=$(python3 -c "import json;print(json.load(open('result.json')).get('day',''))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenge/queue.yaml
          git commit -m "chore(challenge): mark Day ${day} posted to Discord"
          # main can have moved on since checkout (a manual commit, an
          # earlier run). Rebase onto it rather than failing the run and
          # leaving the queue marked locally but not in the repo.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt ${attempt} failed; retrying"
            sleep 5
          done
          echo "could not push the queue update after 3 attempts" >&2
          exit 1
