<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" font-family="Menlo, Consolas, 'SFMono-Regular', monospace">
  <title>Step 3: foo(3, "1", ...) - leaf, appends "1-&gt;3"; final result</title>
  <rect x="0" y="0" width="480" height="240" fill="#fbfbfb"/>

  <!-- edges: 1-2 and 2-5 already completed from the previous branch; 1-3 completed now -->
  <line x1="240" y1="35" x2="140" y2="95" stroke="#2ecc71" stroke-width="4" opacity="0.55"/>
  <line x1="240" y1="35" x2="340" y2="95" stroke="#2ecc71" stroke-width="4"/>
  <line x1="140" y1="95" x2="200" y2="155" stroke="#2ecc71" stroke-width="4" opacity="0.55"/>

  <!-- node 1 (root) - part of both completed paths -->
  <circle cx="240" cy="35" r="18" fill="#eafaf1" stroke="#2ecc71" stroke-width="3"/>
  <text x="240" y="40" text-anchor="middle" font-size="16" font-weight="600" fill="#2f3640">1</text>

  <!-- node 2 - from the earlier completed path -->
  <circle cx="140" cy="95" r="18" fill="#eafaf1" stroke="#2ecc71" stroke-width="3" opacity="0.7"/>
  <text x="140" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#2f3640">2</text>

  <!-- node 3 - leaf just reached, path appended to result -->
  <circle cx="340" cy="95" r="18" fill="#eafaf1" stroke="#2ecc71" stroke-width="3"/>
  <circle cx="354" cy="81" r="5" fill="#2ecc71"/>
  <text x="340" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#2f3640">3</text>

  <!-- node 5 - leaf from the earlier completed path -->
  <circle cx="200" cy="155" r="18" fill="#eafaf1" stroke="#2ecc71" stroke-width="3" opacity="0.7"/>
  <circle cx="214" cy="141" r="5" fill="#2ecc71" opacity="0.7"/>
  <text x="200" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#2f3640">5</text>

  <!-- caption -->
  <text x="20" y="195" font-size="14" fill="#2f3640">current: <tspan fill="#2ecc71" font-weight="600">"1-&gt;3"</tspan></text>
  <text x="20" y="216" font-size="14" fill="#2f3640">result:  [<tspan fill="#2ecc71" font-weight="600">"1-&gt;2-&gt;5", "1-&gt;3"</tspan>]</text>
</svg>
