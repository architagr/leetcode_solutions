<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" font-family="Menlo, Consolas, 'SFMono-Regular', monospace">
  <title>Step 1: binaryTreePaths seeds current with the root</title>
  <rect x="0" y="0" width="480" height="240" fill="#fbfbfb"/>

  <!-- edges (none traversed yet) -->
