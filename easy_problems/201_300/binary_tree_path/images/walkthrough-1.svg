  <text x="240" y="40" text-anchor="middle" font-size="16" font-weight="600" fill="#2f3640">1</text>

  <!-- node 2 -->
  <circle cx="140" cy="95" r="18" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#2f3640">2</text>

  <!-- node 3 -->
