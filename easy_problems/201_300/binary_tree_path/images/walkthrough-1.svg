  <line x1="240" y1="35" x2="340" y2="95" stroke="#cbd3da" stroke-width="2"/>
  <line x1="140" y1="95" x2="200" y2="155" stroke="#cbd3da" stroke-width="2"/>

  <!-- node 1 (root) - current position, path so far = "1" -->
