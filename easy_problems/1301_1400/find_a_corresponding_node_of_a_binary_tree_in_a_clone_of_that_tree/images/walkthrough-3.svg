<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 3 / 3</text>
  <text x="150" y="35" text-anchor="middle" font-size="12" fill="#8a939c">original</text>
  <text x="490" y="35" text-anchor="middle" font-size="12" fill="#8a939c">cloned</text>

  <!-- edges: original tree -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="150" y1="60" x2="80" y2="135"/>
    <line x1="150" y1="60" x2="220" y2="135"/>
    <line x1="220" y1="135" x2="180" y2="215"/>
    <line x1="220" y1="135" x2="260" y2="215"/>
  </g>
  <!-- edges: cloned tree -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="490" y1="60" x2="420" y2="135"/>
    <line x1="490" y1="60" x2="560" y2="135"/>
    <line x1="560" y1="135" x2="520" y2="215"/>
    <line x1="560" y1="135" x2="600" y2="215"/>
  </g>

  <!-- original: root 7 – already visited -->
  <circle cx="150" cy="60" r="20" fill="#ffffff" stroke="#b8c2cc" stroke-width="2"/>
  <text x="150" y="60" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#8a939c">7</text>

  <!-- original: 4 – already visited -->
  <circle cx="80" cy="135" r="20" fill="#ffffff" stroke="#b8c2cc" stroke-width="2"/>
  <text x="80" y="135" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#8a939c">4</text>

  <!-- original: 3 – currently visiting AND the target – match! -->
  <circle cx="220" cy="135" r="24" fill="#ffffff" stroke="#9b59b6" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="220" cy="135" r="20" fill="#ffffff" stroke="#27ae60" stroke-width="4"/>
  <text x="220" y="135" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">3</text>
  <text x="220" y="108" text-anchor="middle" font-size="10" fill="#9b59b6">target</text>

  <!-- original: 6, 19, not visited (irrelevant now) -->
  <circle cx="180" cy="215" r="20" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="180" y="215" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">6</text>
  <circle cx="260" cy="215" r="20" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="260" y="215" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">19</text>

  <!-- cloned: root 7 – already visited -->
  <circle cx="490" cy="60" r="20" fill="#ffffff" stroke="#b8c2cc" stroke-width="2"/>
  <text x="490" y="60" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#8a939c">7</text>

  <!-- cloned: 4 – already visited -->
  <circle cx="420" cy="135" r="20" fill="#ffffff" stroke="#b8c2cc" stroke-width="2"/>
  <text x="420" y="135" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#8a939c">4</text>

  <!-- cloned: 3 – match! this is the returned answer node -->
  <circle cx="560" cy="135" r="20" fill="#ffffff" stroke="#27ae60" stroke-width="4"/>
  <text x="560" y="135" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">3</text>
  <text x="560" y="108" text-anchor="middle" font-size="10" fill="#27ae60">found</text>

  <!-- cloned: 6, 19, not visited (irrelevant now) -->
  <circle cx="520" cy="215" r="20" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="520" y="215" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">6</text>
  <circle cx="600" cy="215" r="20" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="600" y="215" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">19</text>

  <text x="320" y="265" text-anchor="middle" font-size="13" fill="#2f3640">at (original=3, clones=3): clones.Val(3) == target.Val(3) -&gt; match! return clones</text>
</svg>
