<svg xmlns="http://www.w3.org/2000/svg" viewBox="-63.3 -0.3 607.7 260.3" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="-63.3" y="-0.3" width="607.7" height="260.3" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 3 / 3</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="40" x2="350" y2="120"/>
    <line x1="130" y1="120" x2="70" y2="200"/>
    <line x1="130" y1="120" x2="190" y2="200"/>
  </g>
  <!-- root-A edge in red: subtree A returned false -->
  <line x1="240" y1="40" x2="130" y2="120" stroke="#c0392b" stroke-width="3"/>

  <!-- root: 2, current node being evaluated -->
  <circle cx="240" cy="40" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="240" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node A: 2, its subtree already resolved to false -->
  <circle cx="130" cy="120" r="22" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
  <text x="130" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">2</text>

  <!-- node B: 2, matches root and is a leaf -> true -->
  <circle cx="350" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="350" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node C: 5 (faded, already resolved) -->
  <circle cx="70" cy="200" r="22" fill="#ffffff" stroke="#bdc3c7" stroke-width="2"/>
  <text x="70" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#bdc3c7">5</text>

  <!-- node D: 2 (faded, already resolved) -->
  <circle cx="190" cy="200" r="22" fill="#ffffff" stroke="#bdc3c7" stroke-width="2"/>
  <text x="190" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#bdc3c7">2</text>

  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#2f3640">root: left subtree (A) returned false -&gt; overall false, regardless of right</text>
</svg>
