<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 2 / 3</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="40" x2="130" y2="120"/>
    <line x1="240" y1="40" x2="350" y2="120"/>
    <line x1="130" y1="120" x2="190" y2="200"/>
  </g>
  <!-- A-C edge in red: value mismatch -->
  <line x1="130" y1="120" x2="70" y2="200" stroke="#c0392b" stroke-width="3"/>

  <!-- root 2 (untouched at this point) -->
  <circle cx="240" cy="40" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node A: 2, current node being evaluated -->
  <circle cx="130" cy="120" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="130" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node B: 2 (already resolved true, not the focus now) -->
  <circle cx="350" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="350" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node C: 5, mismatch against parent A's value 2 -->
  <circle cx="70" cy="200" r="22" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
  <text x="70" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">5</text>

  <!-- node D: 2, matches parent A's value 2 -->
  <circle cx="190" cy="200" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="190" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#2f3640">at node 2 (A): left child 5 != 2 -&gt; left=false; right child 2==2 -&gt; returns false</text>
</svg>
