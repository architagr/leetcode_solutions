<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 2 / 3 — foo(root, 0, 4)</text>

  <!-- edge root -> 3, never visited (short-circuited), dimmed -->
  <g stroke="#c8ccd0" stroke-width="2">
    <line x1="240" y1="40" x2="350" y2="120"/>
    <line x1="350" y1="120" x2="410" y2="200"/>
  </g>
  <!-- found path root -> 2 -> 4, in accent -->
  <g stroke="#e67e22" stroke-width="3">
    <line x1="240" y1="40" x2="130" y2="120"/>
    <line x1="130" y1="120" x2="190" y2="200"/>
  </g>

  <!-- root 1 -->
  <circle cx="240" cy="40" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>

  <!-- node 2: on the winning path, parent of the match -->
  <circle cx="130" cy="120" r="22" fill="#fdf1e6" stroke="#e67e22" stroke-width="3"/>
  <text x="130" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node 3: never visited, dimmed -->
  <circle cx="350" cy="120" r="22" fill="#ffffff" stroke="#c8ccd0" stroke-width="2"/>
  <text x="350" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#aab0b6">3</text>

  <!-- node 4: the match, current -->
  <circle cx="190" cy="200" r="24" fill="#fdf1e6" stroke="#e67e22" stroke-width="4"/>
  <text x="190" y="200" dy="0.35em" text-anchor="middle" font-size="17" font-weight="700" fill="#e67e22">4</text>

  <!-- node 5: never visited, dimmed -->
  <circle cx="410" cy="200" r="22" fill="#ffffff" stroke="#c8ccd0" stroke-width="2"/>
  <text x="410" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#aab0b6">5</text>

  <text x="240" y="235" text-anchor="middle" font-size="12" fill="#2f3640">4 is a direct child match under 2 -&gt; returns immediately</text>
  <text x="240" y="252" text-anchor="middle" font-size="12" fill="#2f3640">depth=2, parent=2, found=true — subtree rooted at 3 never visited</text>
</svg>
