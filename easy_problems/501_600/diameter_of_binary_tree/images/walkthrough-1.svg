<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 250" font-family="Menlo, Consolas, monospace">
  <rect x="0" y="0" width="350" height="250" fill="#ffffff"/>

  <!-- edges -->
  <line x1="175" y1="40" x2="90" y2="110" stroke="#2f3640" stroke-width="2"/>
  <line x1="175" y1="40" x2="260" y2="110" stroke="#2f3640" stroke-width="2"/>
  <line x1="90" y1="110" x2="50" y2="180" stroke="#2f3640" stroke-width="2"/>
  <line x1="90" y1="110" x2="130" y2="180" stroke="#2f3640" stroke-width="2"/>

  <!-- node 1 -->
  <circle cx="175" cy="40" r="18" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="175" y="45" text-anchor="middle" font-size="14" fill="#2f3640">1</text>

  <!-- node 2 -->
  <circle cx="90" cy="110" r="18" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="90" y="115" text-anchor="middle" font-size="14" fill="#2f3640">2</text>

  <!-- node 3 -->
  <circle cx="260" cy="110" r="18" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="260" y="115" text-anchor="middle" font-size="14" fill="#2f3640">3</text>

  <!-- node 4 (current) -->
  <circle cx="50" cy="180" r="18" fill="#fff5eb" stroke="#e67e22" stroke-width="3"/>
  <text x="50" y="185" text-anchor="middle" font-size="14" fill="#2f3640">4</text>

  <!-- node 5 -->
  <circle cx="130" cy="180" r="18" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="130" y="185" text-anchor="middle" font-size="14" fill="#2f3640">5</text>

  <!-- status panel -->
  <rect x="10" y="210" width="330" height="32" rx="6" fill="#f5f6fa" stroke="#dcdde1"/>
  <text x="20" y="230" font-size="12" fill="#2f3640">calc(4): leaf → left=0 right=0, height=1, dia=0</text>
</svg>
