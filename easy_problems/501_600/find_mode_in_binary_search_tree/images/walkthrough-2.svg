<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 2 / 4 — getCnt(2a, data), root.Right of 1</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="180" y1="60" x2="280" y2="120"/>
    <line x1="280" y1="120" x2="220" y2="180"/>
  </g>

  <!-- node 1 (already visited) -->
  <circle cx="180" cy="60" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="180" y="60" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>

  <!-- node 2a (right child of 1, being visited now) -->
  <circle cx="280" cy="120" r="22" fill="#fdebd3" stroke="#e67e22" stroke-width="4"/>
  <text x="280" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node 2b (left child of 2a, not visited yet) -->
  <circle cx="220" cy="180" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="220" y="180" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- map state panel -->
  <rect x="330" y="50" width="130" height="90" rx="6" fill="#ffffff" stroke="#2f3640" stroke-width="1.5"/>
  <text x="340" y="72" font-size="12" fill="#8a939c">data map</text>
  <text x="340" y="94" font-size="14" fill="#2f3640" font-weight="700">1 → 1</text>
  <text x="340" y="116" font-size="14" fill="#e67e22" font-weight="700">2 → 1</text>

  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#2f3640">data[2]++ → data = {1: 1, 2: 1}</text>
</svg>
