<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="560" height="280" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 1 / 3</text>

  <text x="140" y="255" text-anchor="middle" font-size="12" fill="#8a939c">root</text>
  <text x="420" y="255" text-anchor="middle" font-size="12" fill="#8a939c">subRoot</text>
  <line x1="280" y1="30" x2="280" y2="220" stroke="#e4e6e9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- root tree edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="140" y1="40" x2="80" y2="110"/>
    <line x1="140" y1="40" x2="200" y2="110"/>
    <line x1="80" y1="110" x2="50" y2="180"/>
    <line x1="80" y1="110" x2="110" y2="180"/>
  </g>
  <!-- subRoot tree edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="420" y1="40" x2="380" y2="110"/>
    <line x1="420" y1="40" x2="460" y2="110"/>
  </g>

  <!-- root node 3: current anchor being checked -->
  <circle cx="140" cy="40" r="22" fill="#ffffff" stroke="#e67e22" stroke-width="4"/>
  <text x="140" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">3</text>

  <!-- root node 4, 5, 1, 2: not yet visited -->
  <circle cx="80" cy="110" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="80" y="110" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">4</text>
  <circle cx="200" cy="110" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="200" y="110" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">5</text>
  <circle cx="50" cy="180" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="50" y="180" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>
  <circle cx="110" cy="180" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="110" y="180" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- subRoot node 4: comparison target -->
  <circle cx="420" cy="40" r="22" fill="#ffffff" stroke="#e67e22" stroke-width="4"/>
  <text x="420" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">4</text>
  <circle cx="380" cy="110" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="380" y="110" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>
  <circle cx="460" cy="110" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="460" y="110" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <text x="280" y="45" text-anchor="middle" font-size="18" font-weight="700" fill="#e67e22">≠</text>

  <text x="280" y="240" text-anchor="middle" font-size="12.5" fill="#2f3640">isSubtree(3, subRoot): 3 != 4 → skip equalBinaryTree, recurse into 4 and 5</text>
</svg>
