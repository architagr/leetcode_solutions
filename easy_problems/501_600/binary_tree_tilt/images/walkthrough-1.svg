<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="280" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 1 / 4</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="40" x2="130" y2="120"/>
    <line x1="240" y1="40" x2="350" y2="120"/>
    <line x1="130" y1="120" x2="80" y2="200"/>
    <line x1="130" y1="120" x2="180" y2="200"/>
    <line x1="350" y1="120" x2="400" y2="200"/>
  </g>

  <!-- node 4 (root, untouched at this point) -->
  <circle cx="240" cy="40" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">4</text>

  <!-- node 2 (untouched) -->
  <circle cx="130" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="130" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node 9 (untouched) -->
  <circle cx="350" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="350" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">9</text>

  <!-- node 3: leaf, base case, l=0 r=0, tilt+=0, returns 3 -->
  <circle cx="80" cy="200" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="80" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">3</text>

  <!-- node 5: leaf, base case, l=0 r=0, tilt+=0, returns 5 -->
  <circle cx="180" cy="200" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="180" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">5</text>

  <!-- node 7: leaf, base case, l=0 r=0, tilt+=0, returns 7 -->
  <circle cx="400" cy="200" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="400" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">7</text>

  <text x="240" y="245" text-anchor="middle" font-size="13" fill="#2f3640">3, 5, 7 are leaves: sum(nil)=0 both sides,</text>
  <text x="240" y="263" text-anchor="middle" font-size="13" fill="#2f3640">*res += |0-0| = 0, each returns its own Val</text>
</svg>
