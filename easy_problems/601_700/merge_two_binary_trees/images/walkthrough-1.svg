<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 1 / 3</text>

  <!-- pending edges (children not yet merged) -->
  <g stroke="#c3c8cd" stroke-width="2" stroke-dasharray="4 4">
    <line x1="240" y1="40" x2="140" y2="120"/>
    <line x1="240" y1="40" x2="340" y2="120"/>
  </g>

  <!-- merged root: 1 + 2 = 3, just created -->
  <circle cx="240" cy="40" r="22" fill="#ffffff" stroke="#e67e22" stroke-width="4"/>
  <text x="240" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">3</text>

  <!-- pending left child -->
  <circle cx="140" cy="120" r="20" fill="#f4f5f6" stroke="#c3c8cd" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="140" y="120" dy="0.35em" text-anchor="middle" font-size="15" fill="#8a939c">?</text>

  <!-- pending right child -->
  <circle cx="340" cy="120" r="20" fill="#f4f5f6" stroke="#c3c8cd" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="340" y="120" dy="0.35em" text-anchor="middle" font-size="15" fill="#8a939c">?</text>

  <text x="240" y="150" text-anchor="middle" font-size="11" fill="#8a939c">1 + 2</text>

  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#2f3640">root = mergeTrees(1, 2): both non-nil, new node 1+2=3</text>
</svg>
