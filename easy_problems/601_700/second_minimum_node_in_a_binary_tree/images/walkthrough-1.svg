<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" font-family="SFMono-Regular, Consolas, Menlo, monospace">
  <rect x="0" y="0" width="360" height="280" fill="#ffffff"/>
  <text x="180" y="20" text-anchor="middle" font-size="13" fill="#2f3640" font-weight="bold">Step 1: Initialize</text>

  <!-- edges -->
  <line x1="180" y1="62" x2="90" y2="98" stroke="#2f3640" stroke-width="2"/>
  <line x1="180" y1="62" x2="270" y2="98" stroke="#2f3640" stroke-width="2"/>
  <line x1="270" y1="142" x2="225" y2="180" stroke="#2f3640" stroke-width="2"/>
  <line x1="270" y1="142" x2="315" y2="180" stroke="#2f3640" stroke-width="2"/>

  <!-- root: 2 -->
  <circle cx="180" cy="40" r="22" fill="#ffffff" stroke="#4b7bec" stroke-width="3"/>
  <text x="180" y="45" text-anchor="middle" font-size="14" fill="#2f3640">2</text>

  <!-- left: 2 (leaf) -->
  <circle cx="90" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="90" y="125" text-anchor="middle" font-size="14" fill="#2f3640">2</text>

  <!-- right: 5 -->
  <circle cx="270" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="270" y="125" text-anchor="middle" font-size="14" fill="#2f3640">5</text>

  <!-- right-left: 5 -->
  <circle cx="225" cy="200" r="20" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="225" y="205" text-anchor="middle" font-size="13" fill="#2f3640">5</text>

  <!-- right-right: 7 -->
  <circle cx="315" cy="200" r="20" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="315" y="205" text-anchor="middle" font-size="13" fill="#2f3640">7</text>

  <!-- state panel -->
  <rect x="10" y="234" width="340" height="36" rx="6" fill="#f5f6fa" stroke="#dfe4ea"/>
  <text x="20" y="248" font-size="12" fill="#2f3640">min = root.Val = 2   (root is always the global minimum)</text>
  <text x="20" y="263" font-size="12" fill="#2f3640">ans = &#8734;   (no candidate for second-min found yet)</text>
</svg>
