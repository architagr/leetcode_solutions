<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" font-family="SFMono-Regular, Consolas, Menlo, monospace">
  <rect x="0" y="0" width="360" height="280" fill="#ffffff"/>
  <text x="180" y="20" text-anchor="middle" font-size="13" fill="#2f3640" font-weight="bold">Step 3: dfs(right) — candidate found, subtree pruned</text>

  <!-- edges -->
  <line x1="180" y1="62" x2="90" y2="98" stroke="#dfe4ea" stroke-width="2"/>
  <line x1="180" y1="62" x2="270" y2="98" stroke="#2f3640" stroke-width="2"/>
  <line x1="270" y1="142" x2="225" y2="180" stroke="#dfe4ea" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="270" y1="142" x2="315" y2="180" stroke="#dfe4ea" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- root: 2 (visited) -->
  <circle cx="180" cy="40" r="22" fill="#dfe4ea" stroke="#2f3640" stroke-width="2"/>
  <text x="180" y="45" text-anchor="middle" font-size="14" fill="#2f3640">2</text>

  <!-- left: 2 (visited, dimmed) -->
  <circle cx="90" cy="120" r="22" fill="#dfe4ea" stroke="#dfe4ea" stroke-width="2"/>
  <text x="90" y="125" text-anchor="middle" font-size="14" fill="#b2bec3">2</text>

  <!-- right: 5 (current, candidate found) -->
  <circle cx="270" cy="120" r="22" fill="#2ed573" stroke="#2f3640" stroke-width="3"/>
  <text x="270" y="125" text-anchor="middle" font-size="14" fill="#2f3640">5</text>

  <!-- right-left: 5 (pruned, not visited) -->
  <circle cx="225" cy="200" r="20" fill="#ffffff" stroke="#dfe4ea" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="225" y="205" text-anchor="middle" font-size="13" fill="#b2bec3">5</text>

  <!-- right-right: 7 (pruned, not visited) -->
  <circle cx="315" cy="200" r="20" fill="#ffffff" stroke="#dfe4ea" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="315" y="205" text-anchor="middle" font-size="13" fill="#b2bec3">7</text>
  <text x="270" y="240" text-anchor="middle" font-size="11" fill="#b2bec3" font-style="italic">pruned — subtree floor is 5, can't beat it</text>

  <!-- state panel -->
  <rect x="10" y="248" width="340" height="26" rx="6" fill="#f5f6fa" stroke="#dfe4ea"/>
  <text x="20" y="265" font-size="12" fill="#2f3640">current = right child (5): min(2) &lt; 5 &lt; ans(&#8734;) &#8594; ans = 5.  min = 2   ans = 5</text>
</svg>
