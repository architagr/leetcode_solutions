<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">EXAMPLE 2 · STEP 1 / 2</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="50" x2="140" y2="120"/>
    <line x1="240" y1="50" x2="340" y2="120"/>
    <line x1="140" y1="120" x2="90" y2="190"/>
    <line x1="140" y1="120" x2="190" y2="190"/>
  </g>

  <!-- node 4: root, currently evaluating -->
  <circle cx="240" cy="50" r="22" fill="#ffffff" stroke="#e67e22" stroke-width="4"/>
  <text x="240" y="50" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">4</text>

  <!-- node 2: left subtree, ruled out -->
  <circle cx="140" cy="120" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="140" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node 7: about to be visited next (4 < 5, go right) -->
  <circle cx="340" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="340" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">7</text>

  <!-- node 1: eliminated with left subtree -->
  <circle cx="90" cy="190" r="20" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="90" y="190" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">1</text>

  <!-- node 3: eliminated with left subtree -->
  <circle cx="190" cy="190" r="20" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="190" y="190" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">3</text>

  <text x="240" y="225" text-anchor="middle" font-size="13" fill="#2f3640">searchBST(4, val=5): 4 &lt; 5 -&gt; recurse right</text>
  <text x="240" y="245" text-anchor="middle" font-size="12" fill="#8a939c">left subtree (2,1,3) eliminated entirely</text>
</svg>
