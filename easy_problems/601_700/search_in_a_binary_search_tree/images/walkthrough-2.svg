<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">EXAMPLE 1 · STEP 2 / 2</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="50" x2="140" y2="120"/>
    <line x1="240" y1="50" x2="340" y2="120"/>
    <line x1="140" y1="120" x2="90" y2="190"/>
    <line x1="140" y1="120" x2="190" y2="190"/>
  </g>

  <!-- node 4: already resolved -->
  <circle cx="240" cy="50" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="50" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">4</text>

  <!-- node 2: match! val == root.Val, this whole subtree is the answer -->
  <circle cx="140" cy="120" r="24" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="140" y="120" dy="0.35em" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>

  <!-- node 7: never visited -->
  <circle cx="340" cy="120" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="340" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">7</text>

  <!-- node 1: part of the returned subtree -->
  <circle cx="90" cy="190" r="20" fill="#a9cdee" stroke="#2f3640" stroke-width="2"/>
  <text x="90" y="190" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">1</text>

  <!-- node 3: part of the returned subtree -->
  <circle cx="190" cy="190" r="20" fill="#a9cdee" stroke="#2f3640" stroke-width="2"/>
  <text x="190" y="190" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">3</text>

  <text x="240" y="225" text-anchor="middle" font-size="13" fill="#2f3640">searchBST(2, val=2): 2 == 2 -&gt; found</text>
  <text x="240" y="245" text-anchor="middle" font-size="12" fill="#8a939c">returns node 2, carrying subtree [2,1,3]</text>
</svg>
