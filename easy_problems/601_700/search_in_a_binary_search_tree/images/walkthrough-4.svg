<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">EXAMPLE 2 · STEP 2 / 2</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="50" x2="140" y2="120"/>
    <line x1="240" y1="50" x2="340" y2="120"/>
    <line x1="340" y1="120" x2="290" y2="190"/>
  </g>
  <line x1="340" y1="120" x2="290" y2="190" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- node 4: already resolved -->
  <circle cx="240" cy="50" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="50" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">4</text>

  <!-- node 2: ruled out, never visited -->
  <circle cx="140" cy="120" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="140" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node 7: currently evaluating -->
  <circle cx="340" cy="120" r="22" fill="#ffffff" stroke="#e67e22" stroke-width="4"/>
  <text x="340" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">7</text>

  <!-- 7.Left is nil: recursing into it returns nil immediately -->
  <circle cx="290" cy="190" r="20" fill="#ffffff" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="290" y="190" dy="0.35em" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">nil</text>

  <text x="240" y="225" text-anchor="middle" font-size="13" fill="#2f3640">searchBST(7, val=5): 7 &gt; 5 -&gt; recurse left</text>
  <text x="240" y="245" text-anchor="middle" font-size="12" fill="#8a939c">7.Left is nil -&gt; base case -&gt; returns nil (not found)</text>
</svg>
