<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="280" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 5 / 5</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="40" x2="140" y2="120"/>
    <line x1="240" y1="40" x2="340" y2="120"/>
    <line x1="140" y1="120" x2="80" y2="200"/>
    <line x1="140" y1="120" x2="200" y2="200"/>
    <line x1="340" y1="120" x2="400" y2="200"/>
  </g>

  <!-- node 5: settled, no match -->
  <circle cx="240" cy="40" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">5</text>

  <!-- node 3: settled, no match -->
  <circle cx="140" cy="120" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="140" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">3</text>

  <!-- node 6: current step, FOUND in map -> match! returns true immediately -->
  <circle cx="340" cy="120" r="22" fill="#4a90d9" stroke="#e67e22" stroke-width="4"/>
  <text x="340" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">6</text>

  <!-- node 2: settled, no match -->
  <circle cx="80" cy="200" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="80" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node 4: settled, previously matched -->
  <circle cx="200" cy="200" r="22" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="200" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>

  <!-- node 7: never visited -- recursion into 6's right child is skipped by 6's early return -->
  <circle cx="400" cy="200" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="400" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#8a939c">7</text>

  <text x="240" y="228" text-anchor="middle" font-size="13" fill="#2f3640">map = { 4, 6, 7 } (unchanged) · 7 never visited</text>
  <text x="240" y="250" text-anchor="middle" font-size="13" fill="#2f3640">at 6: 6 already in map (from 3) -&gt; 3+6=9 -&gt; also true</text>
</svg>
