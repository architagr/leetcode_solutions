<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 3 / 3</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="40" x2="130" y2="120"/>
    <line x1="240" y1="40" x2="350" y2="120"/>
    <line x1="350" y1="120" x2="290" y2="200"/>
    <line x1="350" y1="120" x2="410" y2="200"/>
  </g>

  <!-- node 3: currently evaluating -- looking at its own left child (9) -->
  <circle cx="240" cy="40" r="22" fill="#ffffff" stroke="#e67e22" stroke-width="4"/>
  <text x="240" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">3</text>

  <!-- node 9: 3's left child, is a leaf -> counted as a left leaf -->
  <circle cx="130" cy="120" r="22" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="130" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">9</text>

  <!-- node 20: already resolved, returned 15 to its parent -->
  <circle cx="350" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="350" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">20</text>

  <!-- node 15: counted earlier, carried up through r -->
  <circle cx="290" cy="200" r="22" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="290" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">15</text>

  <!-- node 7: right child, never counted -->
  <circle cx="410" cy="200" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="410" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">7</text>

  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#2f3640">at 3: left child 9 is a left-leaf -&gt; l = 9, r = 15 -&gt; return 24</text>
</svg>
