<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 2 / 3</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="40" x2="130" y2="120"/>
    <line x1="240" y1="40" x2="350" y2="120"/>
    <line x1="350" y1="120" x2="290" y2="200"/>
    <line x1="350" y1="120" x2="410" y2="200"/>
  </g>

  <!-- root: OR, still not yet evaluated -->
  <circle cx="240" cy="40" r="24" fill="#ffffff" stroke="#2f3640" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="240" y="40" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#2f3640">OR</text>

  <!-- root.Left: already resolved, now settled -->
  <circle cx="130" cy="120" r="24" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="130" y="120" dy="0.35em" text-anchor="middle" font-size="12" font-weight="700" fill="#2f3640">True</text>

  <!-- AND.Left settled -->
  <circle cx="290" cy="200" r="24" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="290" y="200" dy="0.35em" text-anchor="middle" font-size="11" font-weight="700" fill="#2f3640">False</text>

  <!-- AND.Right settled -->
  <circle cx="410" cy="200" r="24" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="410" y="200" dy="0.35em" text-anchor="middle" font-size="12" font-weight="700" fill="#2f3640">True</text>

  <!-- AND node: left=False, right=True -> left && right = False (just changed) -->
  <circle cx="350" cy="120" r="24" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="350" y="120" dy="0.35em" text-anchor="middle" font-size="12" font-weight="700" fill="#2f3640">False</text>

  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#2f3640">AND node: left &amp;&amp; right = False &amp;&amp; True = False</text>
</svg>
