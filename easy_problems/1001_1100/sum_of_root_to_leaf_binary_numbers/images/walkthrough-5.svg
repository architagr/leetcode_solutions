<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="300" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 5 / 5 &#8212; unwind: leaf sums bubble back up</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="55" x2="140" y2="130"/>
    <line x1="240" y1="55" x2="340" y2="130"/>
    <line x1="140" y1="130" x2="80" y2="205"/>
    <line x1="140" y1="130" x2="200" y2="205"/>
    <line x1="340" y1="130" x2="280" y2="205"/>
    <line x1="340" y1="130" x2="400" y2="205"/>
  </g>

  <!-- root: final answer -->
  <circle cx="240" cy="55" r="24" fill="#e67e22" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="55" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="240" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#e67e22">leftSum+rightSum = 22</text>

  <!-- left child: leftSum = 4 + 5 = 9 -->
  <circle cx="140" cy="130" r="22" fill="#dbe9f7" stroke="#4a90d9" stroke-width="2"/>
  <text x="140" y="130" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">0</text>
  <text x="112" y="152" font-size="12" fill="#4a90d9" text-anchor="end">leftSum=9</text>

  <!-- leftleft leaf -->
  <circle cx="80" cy="205" r="22" fill="#dbe9f7" stroke="#4a90d9" stroke-width="2"/>
  <text x="80" y="205" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">0</text>
  <text x="80" y="240" text-anchor="middle" font-size="12" fill="#4a90d9">= 4</text>

  <!-- leftright leaf -->
  <circle cx="200" cy="205" r="22" fill="#dbe9f7" stroke="#4a90d9" stroke-width="2"/>
  <text x="200" y="205" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>
  <text x="200" y="240" text-anchor="middle" font-size="12" fill="#4a90d9">= 5</text>

  <!-- right child: rightSum = 6 + 7 = 13 -->
  <circle cx="340" cy="130" r="22" fill="#dbe9f7" stroke="#4a90d9" stroke-width="2"/>
  <text x="340" y="130" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>
  <text x="368" y="152" font-size="12" fill="#4a90d9">rightSum=13</text>

  <!-- rightleft leaf -->
  <circle cx="280" cy="205" r="22" fill="#dbe9f7" stroke="#4a90d9" stroke-width="2"/>
  <text x="280" y="205" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">0</text>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#4a90d9">= 6</text>

  <!-- rightright leaf -->
  <circle cx="400" cy="205" r="22" fill="#dbe9f7" stroke="#4a90d9" stroke-width="2"/>
  <text x="400" y="205" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>
  <text x="400" y="240" text-anchor="middle" font-size="12" fill="#4a90d9">= 7</text>

  <text x="240" y="285" text-anchor="middle" font-size="13" fill="#2f3640">sum(root) returns leftSum + rightSum = 9 + 13 = 22</text>
</svg>
