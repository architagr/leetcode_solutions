<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 1 / 3</text>

  <!-- edges: original tree shape, before inOrder touches anything -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="60" x2="150" y2="140"/>
    <line x1="240" y1="60" x2="330" y2="140"/>
  </g>

  <!-- node 5 (root) -->
  <circle cx="240" cy="60" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="60" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">5</text>

  <!-- node 1 (left child) -->
  <circle cx="150" cy="140" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="150" y="140" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>

  <!-- node 7 (right child) -->
  <circle cx="330" cy="140" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="330" y="140" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">7</text>

  <text x="240" y="220" text-anchor="middle" font-size="13" fill="#2f3640">root = [5,1,7] — original BST shape, before inOrder runs</text>
</svg>
