<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 2 / 3</text>

  <!-- three detached nodes, in ascending order, no edges between them yet -->
  <circle cx="120" cy="120" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="120" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>
  <text x="120" y="162" text-anchor="middle" font-size="11" fill="#8a939c">inorder[0]</text>

  <circle cx="240" cy="120" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="240" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">5</text>
  <text x="240" y="162" text-anchor="middle" font-size="11" fill="#8a939c">inorder[1]</text>

  <circle cx="360" cy="120" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="360" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">7</text>
  <text x="360" y="162" text-anchor="middle" font-size="11" fill="#8a939c">inorder[2]</text>

  <text x="240" y="205" text-anchor="middle" font-size="13" fill="#2f3640">inOrder(root) returns [1, 5, 7] — each node's old .Left/.Right</text>
  <text x="240" y="225" text-anchor="middle" font-size="13" fill="#2f3640">was cleared before it was appended, so nothing is linked yet</text>
</svg>
