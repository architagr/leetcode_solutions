<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 3 / 3</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- new .Right links created by the relinking loop -->
  <g stroke="#e67e22" stroke-width="3" marker-end="url(#arrow)">
    <line x1="142" y1="120" x2="216" y2="120"/>
    <line x1="262" y1="120" x2="336" y2="120"/>
  </g>
  <text x="180" y="105" text-anchor="middle" font-size="11" fill="#e67e22">.Right</text>
  <text x="300" y="105" text-anchor="middle" font-size="11" fill="#e67e22">.Right</text>

  <!-- node 1: final returned root, highlighted -->
  <circle cx="120" cy="120" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="120" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>

  <circle cx="240" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">5</text>

  <circle cx="360" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="360" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">7</text>

  <text x="240" y="220" text-anchor="middle" font-size="13" fill="#2f3640">1.Right=5, 5.Right=7 — increasingBST returns inorder[0], node 1</text>
</svg>
