<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="200" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 3 / 3 &#8212; compare</text>

  <text x="16" y="55" font-size="12" fill="#2f3640">root1Leafs</text>
  <g>
