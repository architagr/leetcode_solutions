  <!-- equality marks between the two rows, one per index -->
  <g stroke="#2f3640" stroke-width="2">
    <line x1="137" y1="72" x2="137" y2="94"/>
    <line x1="179" y1="72" x2="179" y2="94"/>
    <line x1="221" y1="72" x2="221" y2="94"/>
    <line x1="263" y1="72" x2="263" y2="94"/>
    <line x1="305" y1="72" x2="305" y2="94"/>
  </g>
  <g font-size="14" font-weight="700" fill="#27ae60" text-anchor="middle">
    <text x="137" y="88">=</text>
    <text x="179" y="88">=</text>
    <text x="221" y="88">=</text>
    <text x="263" y="88">=</text>
    <text x="305" y="88">=</text>
  </g>

  <text x="16" y="107" font-size="12" fill="#2f3640">root2Leafs</text>
  <g transform="translate(120,92)">
    <rect x="0" y="0" width="34" height="28" rx="4" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
    <text x="17" y="14" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
    <rect x="42" y="0" width="34" height="28" rx="4" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
    <text x="59" y="14" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">7</text>
    <rect x="84" y="0" width="34" height="28" rx="4" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
