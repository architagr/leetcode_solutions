  <text x="240" y="150" text-anchor="middle" font-size="13" fill="#2f3640">same length (5) &amp; same value at every index</text>
  <text x="240" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#27ae60">leafSimilar(root1, root2) &#8594; true</text>
