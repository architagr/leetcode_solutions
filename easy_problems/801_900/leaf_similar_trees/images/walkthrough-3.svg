    <text x="143" y="14" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">9</text>
    <rect x="168" y="0" width="34" height="28" rx="4" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
    <text x="185" y="14" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">8</text>
