<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="560" height="280" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 1 / 3 &#8212; root1</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="280" y1="30" x2="160" y2="100"/>
    <line x1="280" y1="30" x2="400" y2="100"/>
    <line x1="160" y1="100" x2="100" y2="170"/>
    <line x1="160" y1="100" x2="220" y2="170"/>
    <line x1="400" y1="100" x2="340" y2="170"/>
    <line x1="400" y1="100" x2="460" y2="170"/>
    <line x1="220" y1="170" x2="180" y2="240"/>
    <line x1="220" y1="170" x2="260" y2="240"/>
  </g>

  <!-- internal nodes (not leaves) -->
  <circle cx="280" cy="30" r="18" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="280" y="30" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">3</text>

  <circle cx="160" cy="100" r="18" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
