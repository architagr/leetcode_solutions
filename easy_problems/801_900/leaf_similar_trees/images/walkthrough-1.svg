  <circle cx="475" cy="153" r="9" fill="#e67e22" stroke="#2f3640" stroke-width="1"/>
  <text x="475" y="153" dy="0.32em" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">5</text>

  <text x="280" y="268" text-anchor="middle" font-size="13" fill="#2f3640">leafs(root1) left-to-right &#8594; (6, 7, 4, 9, 8)</text>
