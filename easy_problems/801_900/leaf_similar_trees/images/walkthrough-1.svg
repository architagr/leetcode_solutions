  <circle cx="220" cy="170" r="18" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="220" y="170" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">2</text>

  <!-- leaves, highlighted, with left-to-right order badges -->
  <circle cx="100" cy="170" r="18" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="100" y="170" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
  <circle cx="115" cy="153" r="9" fill="#e67e22" stroke="#2f3640" stroke-width="1"/>
  <text x="115" y="153" dy="0.32em" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text>

  <circle cx="180" cy="240" r="18" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="180" y="240" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">7</text>
  <circle cx="195" cy="223" r="9" fill="#e67e22" stroke="#2f3640" stroke-width="1"/>
  <text x="195" y="223" dy="0.32em" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text>

  <circle cx="260" cy="240" r="18" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="260" y="240" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <circle cx="275" cy="223" r="9" fill="#e67e22" stroke="#2f3640" stroke-width="1"/>
  <text x="275" y="223" dy="0.32em" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text>

  <circle cx="340" cy="170" r="18" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="340" y="170" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">9</text>
  <circle cx="355" cy="153" r="9" fill="#e67e22" stroke="#2f3640" stroke-width="1"/>
  <text x="355" y="153" dy="0.32em" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">4</text>

  <circle cx="460" cy="170" r="18" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
