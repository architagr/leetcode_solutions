<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 4 / 6</text>
  <text x="240" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#2f3640">Add(10)</text>

  <!-- ghost box: 5 popped out -->
  <rect x="386" y="34" width="64" height="36" rx="6" fill="none" stroke="#b0b6bb" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="418" y="56" text-anchor="middle" font-size="15" fill="#b0b6bb" text-decoration="line-through">5</text>
  <text x="418" y="82" text-anchor="middle" font-size="10" fill="#b0b6bb">popped out</text>

  <!-- heap contents: {5,8,10}, root stays 5 (the other one), new box is 10 -->
  <rect x="114" y="104" width="76" height="76" rx="10" fill="none" stroke="#16a085" stroke-width="3" stroke-dasharray="4 3"/>
  <rect x="120" y="110" width="64" height="64" rx="8" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="152" y="142" dy="0.35em" text-anchor="middle" font-size="20" font-weight="700" fill="#2f3640">5</text>

  <rect x="220" y="110" width="64" height="64" rx="8" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="252" y="142" dy="0.35em" text-anchor="middle" font-size="20" font-weight="700" fill="#2f3640">8</text>

  <rect x="320" y="110" width="64" height="64" rx="8" fill="#fff4e8" stroke="#e67e22" stroke-width="4"/>
  <text x="352" y="142" dy="0.35em" text-anchor="middle" font-size="20" font-weight="700" fill="#2f3640">10</text>

  <text x="152" y="204" text-anchor="middle" font-size="11" fill="#16a085">root (kth largest)</text>

  <text x="240" y="238" text-anchor="middle" font-size="12" fill="#2f3640">5 &lt; 10 → pop 5, push 10. heap = {5,8,10}, returns 5</text>
</svg>
