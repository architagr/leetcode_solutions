  <text x="152" y="204" text-anchor="middle" font-size="11" fill="#16a085">root (kth largest)</text>

  <text x="240" y="238" text-anchor="middle" font-size="12" fill="#2f3640">3 &lt; root(4) → rejected. heap unchanged = {4,5,8}, returns 4</text>
