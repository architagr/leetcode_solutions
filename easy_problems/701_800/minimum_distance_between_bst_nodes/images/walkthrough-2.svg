<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="220" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 2 / 3 — scan arr, minVal = min(minVal, abs(arr[i]-arr[i-1]))</text>

  <!-- array cells -->
  <g>
    <rect x="60"  y="50" width="46" height="38" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
    <text x="83" y="69" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">1</text>
    <rect x="130" y="50" width="46" height="38" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
    <text x="153" y="69" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">2</text>
    <rect x="200" y="50" width="46" height="38" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
    <text x="223" y="69" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">3</text>
    <rect x="270" y="50" width="46" height="38" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
    <text x="293" y="69" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">4</text>
    <rect x="340" y="50" width="46" height="38" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
    <text x="363" y="69" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">6</text>
  </g>

  <!-- diff arcs + labels -->
  <g stroke="#e67e22" stroke-width="2" fill="none">
    <path d="M 106 50 Q 118 30 130 50"/>
    <path d="M 176 50 Q 188 30 200 50"/>
    <path d="M 246 50 Q 258 30 270 50"/>
    <path d="M 316 50 Q 328 30 340 50"/>
  </g>
  <text x="118" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#e67e22">1</text>
  <text x="188" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#e67e22">1</text>
  <text x="258" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#e67e22">1</text>
  <text x="328" y="24" text-anchor="middle" font-size="12" fill="#8a939c">2</text>

  <!-- highlight the winning gap (1-2) -->
  <rect x="100" y="46" width="82" height="46" fill="none" stroke="#e67e22" stroke-width="3" rx="6"/>

  <text x="240" y="130" text-anchor="middle" font-size="12" fill="#2f3640">i=1: |2-1|=1  i=2: |3-2|=1  i=3: |4-3|=1  i=4: |6-4|=2</text>
  <text x="240" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#2f3640">running minVal settles at 1 (first gap already unbeatable)</text>

  <rect x="170" y="175" width="140" height="34" fill="#ccced1" stroke="#e67e22" stroke-width="3"/>
  <text x="240" y="192" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">minVal = 1</text>
</svg>
