<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="180" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 3 / 3 — return minVal</text>

  <!-- tree, de-emphasized -->
  <g stroke="#c7ccd1" stroke-width="2">
    <line x1="120" y1="45" x2="80" y2="90"/>
    <line x1="120" y1="45" x2="160" y2="90"/>
    <line x1="80" y1="90" x2="60" y2="130"/>
    <line x1="80" y1="90" x2="100" y2="130"/>
  </g>
  <g fill="#ffffff" stroke="#c7ccd1" stroke-width="2">
    <circle cx="120" cy="45" r="16"/>
    <circle cx="80" cy="90" r="16"/>
    <circle cx="160" cy="90" r="16"/>
    <circle cx="60" cy="130" r="16"/>
    <circle cx="100" cy="130" r="16"/>
  </g>
  <g font-size="13" font-weight="700" fill="#9aa0a6" text-anchor="middle">
    <text x="120" y="45" dy="0.35em">4</text>
    <text x="80" y="90" dy="0.35em">2</text>
    <text x="160" y="90" dy="0.35em">6</text>
    <text x="60" y="130" dy="0.35em">1</text>
    <text x="100" y="130" dy="0.35em">3</text>
  </g>

  <text x="130" y="165" text-anchor="middle" font-size="11" fill="#8a939c">root = [4,2,6,1,3]</text>

  <!-- arrow -->
  <g stroke="#2f3640" stroke-width="2">
    <line x1="200" y1="90" x2="260" y2="90"/>
    <polygon points="260,90 250,84 250,96" fill="#2f3640"/>
  </g>

  <!-- result -->
  <rect x="290" y="55" width="160" height="70" fill="#ccced1" stroke="#e67e22" stroke-width="4" rx="8"/>
  <text x="370" y="82" text-anchor="middle" font-size="12" fill="#2f3640">minDiffInBST(root)</text>
  <text x="370" y="108" text-anchor="middle" font-size="22" font-weight="700" fill="#2f3640">= 1</text>
</svg>
