<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.0 0.0 480.0 324.0" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0.0" y="0.0" width="480.0" height="324.0" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 1 / 3 — arr := inOrder(root)</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="45" x2="150" y2="110"/>
    <line x1="240" y1="45" x2="330" y2="110"/>
    <line x1="150" y1="110" x2="110" y2="175"/>
    <line x1="150" y1="110" x2="190" y2="175"/>
  </g>

  <!-- node 4 (root) -->
  <circle cx="240" cy="45" r="20" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="45" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">4</text>
  <text x="240" y="20" text-anchor="middle" font-size="10" fill="#e67e22">4th</text>

  <!-- node 2 -->
  <circle cx="150" cy="110" r="20" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="150" y="110" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">2</text>
  <text x="150" y="85" text-anchor="middle" font-size="10" fill="#e67e22">2nd</text>

  <!-- node 6 -->
  <circle cx="330" cy="110" r="20" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="330" y="110" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">6</text>
  <text x="330" y="135" text-anchor="middle" font-size="10" fill="#e67e22">5th</text>

  <!-- node 1 -->
  <circle cx="110" cy="175" r="20" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="110" y="175" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">1</text>
  <text x="110" y="200" text-anchor="middle" font-size="10" fill="#e67e22">1st</text>

  <!-- node 3 -->
  <circle cx="190" cy="175" r="20" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="190" y="175" dy="0.35em" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3640">3</text>
  <text x="190" y="200" text-anchor="middle" font-size="10" fill="#e67e22">3rd</text>

  <text x="240" y="235" text-anchor="middle" font-size="12" fill="#8a939c">left, node, right at every level -&gt; strictly sorted order</text>

  <!-- resulting array -->
  <g>
    <rect x="140" y="250" width="40" height="34" fill="#ccced1" stroke="#e67e22" stroke-width="3"/>
    <text x="160" y="267" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">1</text>
    <rect x="180" y="250" width="40" height="34" fill="#ccced1" stroke="#e67e22" stroke-width="3"/>
    <text x="200" y="267" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">2</text>
    <rect x="220" y="250" width="40" height="34" fill="#ccced1" stroke="#e67e22" stroke-width="3"/>
    <text x="240" y="267" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">3</text>
    <rect x="260" y="250" width="40" height="34" fill="#ccced1" stroke="#e67e22" stroke-width="3"/>
    <text x="280" y="267" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">4</text>
    <rect x="300" y="250" width="40" height="34" fill="#ccced1" stroke="#e67e22" stroke-width="3"/>
    <text x="320" y="267" dy="0.35em" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3640">6</text>
  </g>
  <text x="240" y="298" text-anchor="middle" font-size="11" fill="#2f3640">arr = [1, 2, 3, 4, 6]</text>
</svg>
