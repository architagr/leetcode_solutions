<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="Consolas, 'SF Mono', Menlo, monospace">
  <rect x="0" y="0" width="520" height="260" fill="#ffffff"/>

  <!-- title -->
  <text x="260" y="18" text-anchor="middle" font-size="12" fill="#2f3640" font-weight="bold">Step 1 &#8212; pick mid (index 2), root = 0</text>

  <!-- panel labels -->
  <text x="115" y="34" text-anchor="middle" font-size="11" fill="#666">array slice</text>
  <text x="400" y="34" text-anchor="middle" font-size="11" fill="#666">tree so far</text>

  <!-- divider between panels -->
  <line x1="250" y1="24" x2="250" y2="250" stroke="#e0e0e0" stroke-width="1"/>

  <!-- mid pointer -->
  <text x="113" y="42" text-anchor="middle" font-size="11" fill="#4a90d9" font-weight="bold">mid</text>
  <line x1="113" y1="44" x2="113" y2="50" stroke="#4a90d9" stroke-width="2"/>

  <!-- left-half wrapper: indices 0,1 -> [-10,-3] -->
  <rect x="16" y="50" width="84" height="40" rx="4" fill="none" stroke="#2f3640" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <!-- mid highlight: index 2 -> [0] -->
  <rect x="92" y="44" width="42" height="46" rx="4" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- right-half wrapper: indices 3,4 -> [5,9] -->
  <rect x="130" y="50" width="80" height="40" rx="4" fill="none" stroke="#2f3640" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- array boxes -->
  <g>
    <rect x="20" y="53" width="34" height="34" fill="#ffffff" stroke="#2f3640" stroke-width="1.5"/>
    <text x="37" y="74" text-anchor="middle" font-size="13" fill="#2f3640">-10</text>

    <rect x="58" y="53" width="34" height="34" fill="#ffffff" stroke="#2f3640" stroke-width="1.5"/>
    <text x="75" y="74" text-anchor="middle" font-size="13" fill="#2f3640">-3</text>

    <rect x="96" y="53" width="34" height="34" fill="#ffffff" stroke="#4a90d9" stroke-width="2.5"/>
    <text x="113" y="74" text-anchor="middle" font-size="13" fill="#4a90d9" font-weight="bold">0</text>

    <rect x="134" y="53" width="34" height="34" fill="#ffffff" stroke="#2f3640" stroke-width="1.5"/>
    <text x="151" y="74" text-anchor="middle" font-size="13" fill="#2f3640">5</text>

    <rect x="172" y="53" width="34" height="34" fill="#ffffff" stroke="#2f3640" stroke-width="1.5"/>
    <text x="189" y="74" text-anchor="middle" font-size="13" fill="#2f3640">9</text>
  </g>

  <!-- half labels -->
  <text x="58" y="104" text-anchor="middle" font-size="10" fill="#666">left half</text>
  <text x="170" y="104" text-anchor="middle" font-size="10" fill="#666">right half</text>
  <text x="58" y="118" text-anchor="middle" font-size="10" fill="#888">[-10,-3]</text>
  <text x="170" y="118" text-anchor="middle" font-size="10" fill="#888">[5,9]</text>

  <!-- caption -->
  <text x="115" y="150" text-anchor="middle" font-size="10.5" fill="#2f3640">splits into left [-10,-3] and right [5,9]</text>
  <text x="115" y="168" text-anchor="middle" font-size="10.5" fill="#2f3640">around root value 0</text>

  <!-- tree: just the root so far -->
  <circle cx="400" cy="60" r="18" fill="#ffffff" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="400" y="65" text-anchor="middle" font-size="13" fill="#4a90d9" font-weight="bold">0</text>

  <!-- faint placeholders hinting the two halves still to come -->
  <circle cx="350" cy="120" r="18" fill="none" stroke="#c9ccd1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="450" cy="120" r="18" fill="none" stroke="#c9ccd1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="388" y1="72" x2="360" y2="106" stroke="#c9ccd1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="412" y1="72" x2="440" y2="106" stroke="#c9ccd1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="400" y="230" text-anchor="middle" font-size="10.5" fill="#888">left/right subtrees not built yet</text>
</svg>
