<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="Consolas, 'SF Mono', Menlo, monospace">
  <rect x="0" y="0" width="520" height="260" fill="#ffffff"/>

  <!-- title -->
  <text x="260" y="18" text-anchor="middle" font-size="12" fill="#2f3640" font-weight="bold">Step 2 &#8212; left half [-10,-3]: mid = 1, root = -3</text>

  <!-- panel labels -->
  <text x="115" y="34" text-anchor="middle" font-size="11" fill="#666">array slice</text>
  <text x="400" y="34" text-anchor="middle" font-size="11" fill="#666">tree so far</text>

  <!-- divider between panels -->
  <line x1="250" y1="24" x2="250" y2="250" stroke="#e0e0e0" stroke-width="1"/>

  <!-- mid pointer -->
  <text x="75" y="42" text-anchor="middle" font-size="11" fill="#4a90d9" font-weight="bold">mid</text>
  <line x1="75" y1="44" x2="75" y2="50" stroke="#4a90d9" stroke-width="2"/>

  <!-- left-half wrapper: index 0 -> [-10] -->
  <rect x="16" y="44" width="42" height="46" rx="4" fill="none" stroke="#2f3640" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <!-- mid highlight: index 1 -> [-3] -->
  <rect x="54" y="44" width="42" height="46" rx="4" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- array boxes -->
  <g>
    <rect x="20" y="53" width="34" height="34" fill="#ffffff" stroke="#2f3640" stroke-width="1.5"/>
    <text x="37" y="74" text-anchor="middle" font-size="13" fill="#2f3640">-10</text>

    <rect x="58" y="53" width="34" height="34" fill="#ffffff" stroke="#4a90d9" stroke-width="2.5"/>
    <text x="75" y="74" text-anchor="middle" font-size="13" fill="#4a90d9" font-weight="bold">-3</text>

    <!-- empty right half -->
    <rect x="96" y="53" width="34" height="34" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="113" y="73" text-anchor="middle" font-size="12" fill="#999">&#8709;</text>
  </g>

  <!-- half labels -->
  <text x="37" y="104" text-anchor="middle" font-size="10" fill="#666">left half</text>
  <text x="113" y="104" text-anchor="middle" font-size="10" fill="#666">right half</text>
  <text x="37" y="118" text-anchor="middle" font-size="10" fill="#888">[-10]</text>
  <text x="113" y="118" text-anchor="middle" font-size="10" fill="#888">[]</text>

  <!-- caption -->
  <text x="115" y="150" text-anchor="middle" font-size="10.5" fill="#2f3640">[-10] is a leaf &#8594; becomes -3's</text>
  <text x="115" y="166" text-anchor="middle" font-size="10.5" fill="#2f3640">left child; -3 attaches as 0's</text>
  <text x="115" y="182" text-anchor="middle" font-size="10.5" fill="#2f3640">left child</text>

  <!-- tree: root already placed, left branch fills in this step -->
  <line x1="388" y1="72" x2="362" y2="106" stroke="#4a90d9" stroke-width="2"/>
  <line x1="412" y1="72" x2="440" y2="106" stroke="#c9ccd1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="342" y1="132" x2="326" y2="166" stroke="#4a90d9" stroke-width="2"/>

  <circle cx="400" cy="60" r="18" fill="#ffffff" stroke="#2f3640" stroke-width="1.5"/>
  <text x="400" y="65" text-anchor="middle" font-size="13" fill="#2f3640">0</text>

  <circle cx="350" cy="120" r="18" fill="#ffffff" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="350" y="125" text-anchor="middle" font-size="13" fill="#4a90d9" font-weight="bold">-3</text>

  <circle cx="450" cy="120" r="18" fill="none" stroke="#c9ccd1" stroke-width="1.2" stroke-dasharray="3,3"/>

  <circle cx="320" cy="180" r="18" fill="#ffffff" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="320" y="185" text-anchor="middle" font-size="13" fill="#4a90d9" font-weight="bold">-10</text>

  <text x="400" y="230" text-anchor="middle" font-size="10.5" fill="#888">right subtree still pending</text>
</svg>
