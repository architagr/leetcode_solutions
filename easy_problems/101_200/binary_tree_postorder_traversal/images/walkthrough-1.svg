<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 1 / 3</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="150" y1="40" x2="300" y2="120"/>
    <line x1="300" y1="120" x2="220" y2="200"/>
  </g>

  <!-- node 1 (root, untouched at this point) -->
  <circle cx="150" cy="40" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="150" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>

  <!-- node 2 (untouched, still waiting on both its recursive calls) -->
  <circle cx="300" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="300" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- node 3: leaf, both children nil -> base case hit immediately -> appended first -->
  <circle cx="220" cy="200" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="220" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">3</text>

  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#2f3640">traversal(3): leaf, appends 3 first -&gt; arr = [3]</text>
</svg>
