<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">WHY THE CHECK MATTERS</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="140" y1="60" x2="70" y2="140" stroke-dasharray="4 4"/>
    <line x1="140" y1="60" x2="240" y2="140"/>
    <line x1="240" y1="140" x2="240" y2="185" stroke-dasharray="2 3"/>
  </g>

  <!-- node 2: currently evaluating - left child is nil -->
  <circle cx="140" cy="60" r="22" fill="#ffffff" stroke="#e67e22" stroke-width="4"/>
  <text x="140" y="60" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <!-- nil placeholder for the missing left child -->
  <circle cx="70" cy="140" r="18" fill="#f4f5f6" stroke="#b7bdc4" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="70" y="140" dy="0.35em" text-anchor="middle" font-size="11" fill="#b7bdc4">nil</text>
  <text x="70" y="172" text-anchor="middle" font-size="11" fill="#b7bdc4">left = 0</text>

  <!-- node 3: the only real child -->
  <circle cx="240" cy="140" r="22" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="140" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="240" y="172" text-anchor="middle" font-size="11" fill="#2f3640">right = 4</text>

  <text x="330" y="145" font-size="12" fill="#8a939c">⋯ chain</text>
  <text x="330" y="161" font-size="12" fill="#8a939c">continues</text>
  <text x="330" y="177" font-size="12" fill="#8a939c">to leaf 6</text>

  <text x="240" y="215" text-anchor="middle" font-size="13" fill="#2f3640">left == 0, so skip min entirely -&gt; return right+1 = 5</text>
  <text x="240" y="235" text-anchor="middle" font-size="12" fill="#c0392b">(min(0, right)+1 would have wrongly returned 1)</text>
</svg>
