<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14.0 -0.3 508.0 263.3" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="-14.0" y="-0.3" width="508.0" height="263.3" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 1 / 4</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="40" x2="130" y2="120"/>
    <line x1="240" y1="40" x2="350" y2="120"/>
    <line x1="350" y1="120" x2="290" y2="200"/>
    <line x1="350" y1="120" x2="410" y2="200"/>
  </g>

  <!-- node 3 (root, not reached yet) -->
  <circle cx="240" cy="40" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">3</text>

  <!-- node 20 (not reached yet) -->
  <circle cx="350" cy="120" r="22" fill="#ffffff" stroke="#2f3640" stroke-width="2"/>
  <text x="350" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">20</text>

  <!-- node 9: leaf, both children nil -> falls through to return right+1 = 1 -->
  <circle cx="130" cy="120" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="130" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">9</text>
  <text x="130" y="155" text-anchor="middle" font-size="12" fill="#e67e22">-&gt;1</text>

  <!-- node 15: leaf, returns 1 -->
  <circle cx="290" cy="200" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="290" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">15</text>
  <text x="290" y="235" text-anchor="middle" font-size="12" fill="#e67e22">-&gt;1</text>

  <!-- node 7: leaf, returns 1 -->
  <circle cx="410" cy="200" r="22" fill="#ccced1" stroke="#e67e22" stroke-width="4"/>
  <text x="410" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">7</text>
  <text x="410" y="235" text-anchor="middle" font-size="12" fill="#e67e22">-&gt;1</text>

  <text x="240" y="248" text-anchor="middle" font-size="13" fill="#2f3640">9, 15, 7: left=right=0, so left!=0 fails -&gt; return right+1 = 1</text>
</svg>
