<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Menlo, Consolas, monospace">
  <rect width="440" height="360" fill="#ffffff"/>
  <text x="220" y="22" text-anchor="middle" font-size="14" fill="#2f3640" font-weight="bold">Step 5: root combines rightHeight=1, leftHeight=3 → imbalance</text>

  <line x1="260" y1="70" x2="150" y2="150" stroke="#2f3640" stroke-width="2"/>
  <line x1="260" y1="70" x2="370" y2="150" stroke="#2f3640" stroke-width="2"/>
  <line x1="150" y1="150" x2="90" y2="230" stroke="#2f3640" stroke-width="2"/>
  <line x1="150" y1="150" x2="230" y2="230" stroke="#2f3640" stroke-width="2"/>
  <line x1="90" y1="230" x2="50" y2="310" stroke="#2f3640" stroke-width="2"/>
  <line x1="90" y1="230" x2="150" y2="310" stroke="#2f3640" stroke-width="2"/>

  <g>
    <circle cx="370" cy="150" r="20" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="370" y="155" text-anchor="middle" font-size="13" fill="#2f3640">2</text>
    <text x="370" y="182" text-anchor="middle" font-size="9" fill="#27ae60">h=1 ok</text>
  </g>
  <g>
    <circle cx="150" cy="150" r="20" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="150" y="155" text-anchor="middle" font-size="13" fill="#2f3640">2</text>
    <text x="150" y="182" text-anchor="middle" font-size="9" fill="#27ae60">h=3 ok</text>
  </g>
  <g>
    <circle cx="230" cy="230" r="20" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="230" y="235" text-anchor="middle" font-size="13" fill="#2f3640">3</text>
    <text x="230" y="262" text-anchor="middle" font-size="9" fill="#27ae60">h=1 ok</text>
  </g>
  <g>
    <circle cx="90" cy="230" r="20" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="90" y="235" text-anchor="middle" font-size="13" fill="#2f3640">3</text>
    <text x="90" y="262" text-anchor="middle" font-size="9" fill="#27ae60">h=2 ok</text>
  </g>
  <g>
    <circle cx="50" cy="310" r="20" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="50" y="315" text-anchor="middle" font-size="13" fill="#2f3640">4</text>
  </g>
  <g>
    <circle cx="150" cy="310" r="20" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="150" y="315" text-anchor="middle" font-size="13" fill="#2f3640">4</text>
  </g>

  <!-- fail: root -->
  <circle cx="260" cy="70" r="20" fill="#fdecea" stroke="#e74c3c" stroke-width="3"/>
  <text x="260" y="75" text-anchor="middle" font-size="13" fill="#2f3640" font-weight="bold">1</text>
  <text x="260" y="102" text-anchor="middle" font-size="9" fill="#e74c3c" font-weight="bold">&#916;=2 ✗</text>

  <text x="220" y="345" text-anchor="middle" font-size="10" fill="#57606f">diff = leftHeight(3) - rightHeight(1) = 2, |diff| &gt; 1 → ok=false → isBalanced returns false</text>
</svg>
