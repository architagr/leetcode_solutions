<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="520" height="320" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 1 / 4</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="260" y1="40" x2="150" y2="110"/>
    <line x1="260" y1="40" x2="370" y2="110"/>
    <line x1="150" y1="110" x2="150" y2="180"/>
    <line x1="370" y1="110" x2="330" y2="180"/>
    <line x1="370" y1="110" x2="410" y2="180"/>
    <line x1="150" y1="180" x2="100" y2="250"/>
    <line x1="150" y1="180" x2="200" y2="250"/>
    <line x1="410" y1="180" x2="410" y2="250"/>
  </g>

  <!-- node 5: root, descended already -->
  <circle cx="260" cy="40" r="22" fill="#ffffff" stroke="#e67e22" stroke-width="4"/>
  <text x="260" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">5</text>
  <text x="260" y="10" text-anchor="middle" font-size="11" fill="#e67e22">current=0</text>

  <!-- node 4: only child is Left (11) -> single-branch recursion -->
  <circle cx="150" cy="110" r="22" fill="#ffffff" stroke="#e67e22" stroke-width="4"/>
  <text x="150" y="110" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">4</text>
  <text x="150" y="82" text-anchor="middle" font-size="11" fill="#e67e22">current=5</text>

  <!-- node 8: right subtree, not yet visited -->
  <circle cx="370" cy="110" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="370" y="110" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">8</text>

  <!-- node 11: currently evaluating, both children exist -->
  <circle cx="150" cy="180" r="22" fill="#ffffff" stroke="#e67e22" stroke-width="4"/>
  <text x="150" y="180" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">11</text>
  <text x="150" y="212" text-anchor="middle" font-size="11" fill="#e67e22">current=9</text>

  <!-- node 13, 4', 7, 2, 1: not yet visited -->
  <circle cx="330" cy="180" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="330" y="180" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">13</text>

  <circle cx="410" cy="180" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="410" y="180" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">4</text>

  <circle cx="100" cy="250" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="100" y="250" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">7</text>

  <circle cx="200" cy="250" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="200" y="250" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">2</text>

  <circle cx="410" cy="250" r="22" fill="#ccced1" stroke="#2f3640" stroke-width="2"/>
  <text x="410" y="250" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#2f3640">1</text>

  <text x="260" y="295" text-anchor="middle" font-size="13" fill="#2f3640">current sum descends: 5 -&gt; 4 (current=5) -&gt; 11 (current=9)</text>
</svg>
