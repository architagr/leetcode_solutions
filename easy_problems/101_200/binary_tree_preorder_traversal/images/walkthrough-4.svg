<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>
  <text x="16" y="20" font-size="11" letter-spacing="1" fill="#8a939c">STEP 4 / 4</text>

  <!-- edges -->
  <g stroke="#7f8c8d" stroke-width="2">
    <line x1="240" y1="40" x2="350" y2="120"/>
    <line x1="350" y1="120" x2="290" y2="200"/>
  </g>

  <!-- node 1: final -->
  <circle cx="240" cy="40" r="22" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="240" y="40" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>

  <!-- node 2: final -->
  <circle cx="350" cy="120" r="22" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="350" y="120" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>

  <!-- node 3: final, both children nil -->
  <circle cx="290" cy="200" r="22" fill="#4a90d9" stroke="#2f3640" stroke-width="2"/>
  <text x="290" y="200" dy="0.35em" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>

  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#2f3640">3's children are nil; unwind all the way -&gt; return [1,2,3]</text>
</svg>
