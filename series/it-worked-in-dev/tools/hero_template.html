<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 1200px; height: 630px; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 64px;
    background: linear-gradient(135deg, {FROM} 0%, {TO} 100%);
    color: #ffffff; display: flex; flex-direction: column; justify-content: space-between;
    position: relative;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .badge {
    width: 56px; height: 56px; border-radius: 12px; background: #0d0d0d;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .badge img { width: 100%; height: 100%; object-fit: cover; }
  .challenge-name { font-size: 20px; letter-spacing: 2px; text-transform: uppercase; color: #ffa116; }
  .episode { font-size: 26px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #cccccc; margin: 0 0 12px 0; }
  /* The headline is the whole point of the series, so it is the largest
     thing on the card. It gets the full content width rather than the title's
     840px cap, because it sits at mid-card and the author block is bottom
     right. autofit below shrinks it to fit instead of clipping - a headline
     worth reading is worth more than a fixed type size. */
  .number { font-size: 104px; font-weight: 800; line-height: 1.0; max-width: 1072px; white-space: nowrap; }
  .number small { font-size: 40px; font-weight: 500; color: #cccccc; }
  .meta { font-size: 26px; color: #ffa116; text-transform: uppercase; letter-spacing: 1px; margin: 28px 0 12px 0; }
  .title { font-size: 42px; font-weight: 700; line-height: 1.2; max-width: 840px; overflow-wrap: break-word; }
  .author {
    position: absolute; bottom: 64px; right: 64px;
    display: flex; align-items: center; gap: 12px;
  }
  .author img {
    width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
    border: 2px solid #ffa116;
  }
  .author-name { font-size: 18px; color: #cccccc; }
  /* Both newsletter marks sit on one row in the top right, the daily one
     first. Together with the series badge on the left they read as a single
     rule across the top of the card. The 32px gap is wide enough that the two
     do not read as one four-part lockup; nowrap stops a long name folding
     under its own mark. */
  .newsletters {
    position: absolute; top: 64px; right: 64px;
    display: flex; flex-direction: row; align-items: center; gap: 32px;
    white-space: nowrap;
  }
  .newsletter {
    display: flex; align-items: center; gap: 12px;
  }
  .newsletter img {
    width: 44px; height: 44px; border-radius: 10px; object-fit: cover;
  }
  .newsletter-name { font-size: 18px; color: #cccccc; }
</style>
</head>

  <script>
    // Shrink the headline until it fits the card rather than clipping it or
    // forcing the author to write something artificially short. Floor at
    // 56px: below that it stops working as the thing you see in a feed at
    // thumbnail size, and the headline needs rewriting instead.
    (function () {
      var el = document.querySelector('.number');
      var box = el.parentElement.clientWidth;
      for (var size = 104; size >= 56; size -= 2) {
        el.style.fontSize = size + 'px';
        if (el.scrollWidth <= box) { break; }
      }
      document.title = 'fit:' + el.style.fontSize;
    })();
  </script>
